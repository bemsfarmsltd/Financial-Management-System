plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.bemsfarms.bems_staff_app"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.bemsfarms.bems_staff_app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    def releaseStore = System.getenv("BEMS_RELEASE_KEYSTORE_PATH")
    def releaseStorePassword = System.getenv("BEMS_RELEASE_STORE_PASSWORD")
    def releaseKeyAlias = System.getenv("BEMS_RELEASE_KEY_ALIAS")
    def releaseKeyPassword = System.getenv("BEMS_RELEASE_KEY_PASSWORD")
    def releaseSigningReady = releaseStore && releaseStorePassword && releaseKeyAlias && releaseKeyPassword
    if (gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") } && !releaseSigningReady) {
        throw new GradleException("Configure BEMS_RELEASE_KEYSTORE_PATH, BEMS_RELEASE_STORE_PASSWORD, BEMS_RELEASE_KEY_ALIAS and BEMS_RELEASE_KEY_PASSWORD before building a release.")
    }
    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile = file(releaseStore)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def appName = "BEMS-Staff-Portal"
            def vName = variant.versionName ?: "1.0.0"
            outputFileName = "${appName}-v${vName}.apk"
        }
    }
}

flutter {
    source = "../.."
}
