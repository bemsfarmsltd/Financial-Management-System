name: BEMS Group CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Validate Fullstack App
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bems_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: bems_corrections_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bems_test -d bems_corrections_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://bems_test:test_only@127.0.0.1:5432/bems_corrections_test
      DIRECT_URL: postgresql://bems_test:test_only@127.0.0.1:5432/bems_corrections_test
      HOSTINGER_DEPLOY_WEBHOOK: ${{ secrets.HOSTINGER_DEPLOY_WEBHOOK }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck Codebase
        run: npx tsc --noEmit

      - name: Verify Platform Architecture & Parity Regressions
        run: npm run verify:platform

      - name: Verify security behavior
        run: npm run test:security

      - name: Apply migrations to isolated CI database
        run: npx prisma migrate deploy

      - name: Verify financial transactions, scoped reads, and delivery retries
        run: npm run test:database

      - name: Verify wallet funding, sole-GMD approval and ledger invariants
        run: npm run test:wallet

      - name: Build Next.js Production Bundle
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # Dummy connection string for build-time compilation
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/postgres"
          DIRECT_URL: "postgresql://dummy:dummy@localhost:5432/postgres"
        run: npm run build

      # Optional: Auto-trigger Hostinger Git webhook if configured
      - name: Notify Hostinger Webhook (Optional)
        if: ${{ env.HOSTINGER_DEPLOY_WEBHOOK != '' }}
        run: |
          curl -X POST "$HOSTINGER_DEPLOY_WEBHOOK"
